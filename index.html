<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wesie</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Playfair+Display:ital,wght@0,400;1,400&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070305;
      --pink-neon: #ff2a70;
      --pink-soft: #ffb3c6;
      --text-main: #fff0f3;
      --text-muted: #e2b4c7;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Quicksand', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    /* Cinematic Video Background (واضح وبدون Blur قوي) */
    .bg-video-container {
      position: fixed;
      inset: 0;
      z-index: -3;
      overflow: hidden;
      background-color: var(--bg-dark);
    }

    .bg-video {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vw;
      height: 100vh;
      object-fit: cover; 
    }

    /* طبقة تعتيم خفيفة جداً ليبقى الفيديو واضحاً (أقل من 20%) */
    .bg-overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 3, 5, 0.35); 
      z-index: -2;
    }

    #particles {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    /* MAIN CONTENT */
    #main-content {
      display: flex;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      max-width: 440px;
      padding: 20px;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .profile-section { 
      text-align: center; 
      width: 100%; 
      animation: fadeInUp 1s ease forwards;
    }
    
    .tagline { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 4px; }
    
    .sub-bio {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 500;
      font-size: 18px;
      color: var(--text-main);
      letter-spacing: 0.8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      animation: fadeInDown 1s ease;
    }

    /* RECTANGLE LINK */
    .links-container {
      display: flex;
      justify-content: center;
      width: 100%;
      animation: fadeInUp 1.2s ease forwards;
    }

    .link-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(15, 4, 10, 0.45);
      border: 1px solid rgba(255, 42, 112, 0.3);
      border-radius: 18px;
      width: 100%;
      max-width: 320px;
      height: 110px;
      padding: 16px;
      text-decoration: none;
      color: var(--text-main);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      animation: pulseGlow 3s infinite ease-in-out;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .link-card:hover {
      transform: translateY(-4px) scale(1.03);
      background: rgba(30, 8, 18, 0.75);
      border-color: rgba(255, 42, 112, 0.7);
      box-shadow: 0 12px 35px rgba(255, 42, 112, 0.4);
    }

    @keyframes pulseGlow {
      0% { transform: scale(1); border-color: rgba(255, 42, 112, 0.3); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
      50% { transform: scale(1.015); border-color: rgba(255, 42, 112, 0.6); box-shadow: 0 10px 30px rgba(255, 42, 112, 0.3); }
      100% { transform: scale(1); border-color: rgba(255, 42, 112, 0.3); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
    }

    .link-icon {
      width: 36px;
      height: 36px;
      background: rgba(25, 6, 14, 0.6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      border: 1px solid rgba(255, 42, 112, 0.3);
      font-size: 15px;
      animation: bounceIcon 2s infinite ease-in-out;
    }

    @keyframes bounceIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .link-content {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .link-title {
      font-family: 'Quicksand', sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fff;
    }

    /* Social Section */
    .social-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeInUp 1.4s ease forwards;
    }

    .social-circles { display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 5px; }
    .social-circle-link {
      width: 36px; height: 36px; border-radius: 50%; background: rgba(15, 4, 8, 0.4);
      border: 1px solid rgba(255, 42, 112, 0.25); display: flex; align-items: center; justify-content: center;
      color: var(--pink-soft); text-decoration: none; transition: all 0.3s ease;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .social-circle-link:hover {
      transform: translateY(-3px) scale(1.1); background: rgba(255, 42, 112, 0.25);
      border-color: var(--pink-neon); color: #fff;
    }
    .social-circle-link svg { width: 15px; height: 15px; }

    /* Footer */
    .footer {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-family: 'Cinzel', serif;
      font-size: 16px;
      color: var(--text-main);
      letter-spacing: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-shadow: 0 0 12px rgba(255, 42, 112, 0.4);
      z-index: 10;
      width: 100%;
      animation: fadeIn 1.6s ease;
    }
    .classic-ornament {
      color: var(--pink-soft);
      font-size: 12px;
      opacity: 0.8;
    }
    .footer-verified-badge {
      display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px;
      background: linear-gradient(135deg, #00b4db, #0083b0); border-radius: 50%; color: white;
      font-size: 8px; font-family: 'Quicksand', sans-serif; font-weight: 700;
      box-shadow: 0 0 10px #00b4db;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <!-- Background Video (مفعل وواضح تماماً) -->
  <div class="bg-video-container">
    <video autoplay muted loop playsinline class="bg-video">
      <source src="bg.mp4" type="video/mp4">
    </video>
  </div>
  <div class="bg-overlay"></div>
  <canvas id="particles"></canvas>

  <!-- Main Content -->
  <div id="main-content">
    
    <div class="profile-section">
      <div class="tagline">
        <div class="sub-bio">Come get know ur nightmare</div>
      </div>
    </div>

    <!-- RECTANGLE LINK -->
    <div class="links-container">
      <a href="https://www.stacked.com/@wslo/membership?lang=en" class="link-card" target="_blank">
        <div class="link-icon">👠</div>
        <div class="link-content">
          <div class="link-title">LET'S CHAT | MORE 🌶️ CONTENT</div>
        </div>
      </a>
    </div>

    <!-- Social Section -->
    <div class="social-section">
      <div class="social-circles">
        <a href="https://t.me/+zjFOawc7051hNzM8" class="social-circle-link" target="_blank" aria-label="Telegram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </a>
        <a href="https://www.instagram.com/wsloffcial" class="social-circle-link" target="_blank" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </a>
        <a href="https://www.tiktok.com/@wesuie" class="social-circle-link" target="_blank" aria-label="TikTok">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5v3a3 3 0 0 1-3-3v7a8 8 0 1 1-8-8v3a5 5 0 0 0 5 5z"></path>
          </svg>
        </a>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    <span class="classic-ornament">✧</span>
    <span>WSLOFFCIAL</span>
    <span class="footer-verified-badge">✓</span>
    <span class="classic-ornament">✧</span>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const vid = document.querySelector('.bg-video');
      if(vid) {
        vid.muted = false;
        vid.volume = 0.4;
        vid.play().catch(e => {
          // محاولة إعادة التشغيل تلقائياً في حال حظر المتصفح
          vid.muted = true;
          vid.play();
        });
      }
      initParticles();
    });

    function initParticles() {
      const canvas = document.getElementById("particles");
      if(!canvas) return;
      const ctx = canvas.getContext("2d");
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;
      let particles = [];

      window.addEventListener('resize', () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });

      class Particle {
        constructor() {
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.size = Math.random() * 2.5 + 0.5;
          this.speedY = Math.random() * -0.5 - 0.1;
          this.speedX = (Math.random() - 0.5) * 0.3;
          this.opacity = Math.random() * 0.7 + 0.1;
        }
        update() {
          this.y += this.speedY;
          this.x += this.speedX;
          if (this.y < 0) {
            this.y = h;
            this.x = Math.random() * w;
          }
        }
        draw() {
          ctx.fillStyle = `rgba(255, 42, 112, ${this.opacity})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      for (let i = 0; i < 50; i++) {
        particles.push(new Particle());
      }

      function animate() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => {
          p.update();
          p.draw();
        });
        requestAnimationFrame(animate);
      }
      animate();
    }
  </script>
</body>
</html>
